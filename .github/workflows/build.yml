name: Build toolchain archives

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vflash_run_id:
        description: 'vflash CI run ID (blank: latest successful run on main)'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: toolchains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vflash:
    name: Select vflash artifacts
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
      # Set VFLASH_TOKEN to a fine-grained token for the private vflash repo
      # with Actions: read permission. No source checkout/Contents permission needed.
      - name: Find a successful run with all four artifacts
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VFLASH_TOKEN }}
          VFLASH_REPOSITORY: ${{ vars.VFLASH_REPOSITORY || 'PascalSkylake/vflash' }}
          VFLASH_BRANCH: ${{ vars.VFLASH_BRANCH || 'main' }}
          VFLASH_WORKFLOW: ${{ vars.VFLASH_WORKFLOW || 'ci.yml' }}
          VFLASH_RUN_ID: ${{ inputs.vflash_run_id }}
        run: bash select-vflash-run.sh "$VFLASH_RUN_ID"

  build:
    name: ${{ matrix.platform }}
    needs: vflash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux-x86_64
            runner: ubuntu-22.04
            exe: ''
          - platform: Linux-AArch64
            runner: ubuntu-24.04-arm
            exe: ''
          - platform: Darwin-universal
            runner: macos-15
            exe: ''
          - platform: Windows-x86_64
            runner: windows-2025
            exe: .exe
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      XZ_OPT: -T2 -6
    steps:
      - uses: actions/checkout@v5

      - name: Download vflash binary
        env:
          GH_TOKEN: ${{ secrets.VFLASH_TOKEN }}
          VFLASH_REPOSITORY: ${{ vars.VFLASH_REPOSITORY || 'PascalSkylake/vflash' }}
          VFLASH_RUN_ID: ${{ needs.vflash.outputs.run_id }}
          PLATFORM: ${{ matrix.platform }}
        run: bash download-vflash.sh "$PLATFORM" "$VFLASH_RUN_ID" "$RUNNER_TEMP/vflash"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools binutils curl unzip xz-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          command -v xz >/dev/null || brew install xz
          # The VEX-supplied vexcom is Intel-only.
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install MinGW build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils curl tar gzip unzip xz

      - name: Check Bash syntax
        run: |
          for script in *.sh; do bash -n "$script"; done

      - name: Build make
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash build-make.sh "$PLATFORM" "$RUNNER_TEMP/make"

      - name: Build make on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash build-make.sh "$PLATFORM" "$RUNNER_TEMP/make"

      - name: Package ATfE and tools
        if: runner.os != 'Windows'
        id: package
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          bash build-toolchain.sh "$PLATFORM" "$RUNNER_TEMP/make/make$EXE" \
            "$RUNNER_TEMP/vflash/vflash$EXE" "$RUNNER_TEMP/dist"

      - name: Package ATfE and tools on Windows
        if: runner.os == 'Windows'
        id: package_windows
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          bash build-toolchain.sh "$PLATFORM" "$RUNNER_TEMP/make/make$EXE" \
            "$RUNNER_TEMP/vflash/vflash$EXE" "$RUNNER_TEMP/dist"

      - name: Test the finished archive
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: bash test-toolchain.sh "$PLATFORM" "$ARCHIVE"

      - name: Test the finished archive on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ steps.package_windows.outputs.archive }}
        run: bash test-toolchain.sh "$PLATFORM" "$ARCHIVE"

      # Upload only the finished tar.xz, directly, without a ZIP wrapper.
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive || steps.package_windows.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14
