name: Build toolchain archives

on:
  push:
  pull_request:
  schedule:
    # Check daily at 06:17 UTC, away from the busy start of the hour.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      atfe_version:
        description: 'ATfE version, e.g. 23.1.0 (blank: latest stable)'
        default: ''
        type: string
      vflash_tag:
        description: 'vflash release tag, e.g. v1.0.0 (blank: latest stable)'
        default: ''
        type: string
      publish:
        description: 'Publish the four tested archives as a release (default branch only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: toolchains-${{ github.ref }}
  # A push must not interrupt an automatic release halfway through publication.
  cancel-in-progress: false

jobs:
  select:
    name: Select ATfE and vflash releases
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.atfe.outputs.version }}
      build: ${{ steps.atfe.outputs.build }}
      vflash_tag: ${{ steps.vflash.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Select ATfE version and check release assets
        id: atfe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATFE_VERSION: ${{ inputs.atfe_version }}
          SKIP_PUBLISHED: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          SKIP_UNREADY: ${{ github.event_name == 'schedule' }}
        run: bash select-atfe-release.sh "$ATFE_VERSION"
      # VFLASH_TOKEN needs Contents: read access to the private vflash repository.
      - name: Select vflash release with all four binaries
        if: steps.atfe.outputs.build == 'true'
        id: vflash
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VFLASH_TOKEN }}
          VFLASH_REPOSITORY: ${{ vars.VFLASH_REPOSITORY || 'PascalSkylake/vflash' }}
          VFLASH_TAG: ${{ inputs.vflash_tag || vars.VFLASH_TAG }}
        run: bash select-vflash-release.sh "$VFLASH_TAG"

  build:
    name: ${{ matrix.platform }}
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux-x86_64
            runner: ubuntu-22.04
            exe: ''
          - platform: Linux-AArch64
            runner: ubuntu-24.04-arm
            exe: ''
          - platform: Darwin-universal
            runner: macos-15
            exe: ''
          - platform: Windows-x86_64
            runner: windows-2025
            exe: .exe
    defaults:
      run:
        shell: bash
    env:
      ATFE_VERSION: ${{ needs.select.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      XZ_OPT: -T2 -6
    steps:
      - uses: actions/checkout@v5

      - name: Download vflash binary
        env:
          GH_TOKEN: ${{ secrets.VFLASH_TOKEN }}
          VFLASH_REPOSITORY: ${{ vars.VFLASH_REPOSITORY || 'PascalSkylake/vflash' }}
          VFLASH_TAG: ${{ needs.select.outputs.vflash_tag }}
          PLATFORM: ${{ matrix.platform }}
        run: bash download-vflash.sh "$PLATFORM" "$VFLASH_TAG" "$RUNNER_TEMP/vflash"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools binutils curl unzip xz-utils

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          command -v xz >/dev/null || brew install xz
          # The VEX-supplied vexcom is Intel-only.
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install MinGW build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils curl tar gzip unzip xz

      - name: Check Bash syntax
        run: |
          for script in *.sh; do bash -n "$script"; done

      - name: Build make
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash build-make.sh "$PLATFORM" "$RUNNER_TEMP/make"

      - name: Build make on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash build-make.sh "$PLATFORM" "$RUNNER_TEMP/make"

      - name: Package ATfE and tools
        if: runner.os != 'Windows'
        id: package
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          bash build-toolchain.sh "$PLATFORM" "$RUNNER_TEMP/make/make$EXE" \
            "$RUNNER_TEMP/vflash/vflash$EXE" "$RUNNER_TEMP/dist"

      - name: Package ATfE and tools on Windows
        if: runner.os == 'Windows'
        id: package_windows
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ matrix.exe }}
        run: |
          bash build-toolchain.sh "$PLATFORM" "$RUNNER_TEMP/make/make$EXE" \
            "$RUNNER_TEMP/vflash/vflash$EXE" "$RUNNER_TEMP/dist"

      - name: Test the finished archive
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: bash test-toolchain.sh "$PLATFORM" "$ARCHIVE"

      - name: Test the finished archive on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ steps.package_windows.outputs.archive }}
        run: bash test-toolchain.sh "$PLATFORM" "$ARCHIVE"

      # Upload only the finished tar.xz, directly, without a ZIP wrapper.
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive || steps.package_windows.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish toolchain release
    needs: [select, build]
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download the four tested archives
        uses: actions/download-artifact@v8
        with:
          pattern: ATfE-${{ needs.select.outputs.version }}-*.tar.xz
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish release with archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATFE_VERSION: ${{ needs.select.outputs.version }}
          VFLASH_TAG: ${{ needs.select.outputs.vflash_tag }}
          VFLASH_REPOSITORY: ${{ vars.VFLASH_REPOSITORY || 'PascalSkylake/vflash' }}
        run: bash publish-release.sh "$GITHUB_REPOSITORY" "$ATFE_VERSION" "$VFLASH_TAG" "$RUNNER_TEMP/release"
